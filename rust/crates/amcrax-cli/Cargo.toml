[package]
name = "amcrax-cli"
description = "Command-line front end of the AmCraX engine (binary `amcrax`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "amcrax"
path = "src/main.rs"

[features]
# CoolProp 8.0.0 C++ back end for the fluid properties (links the static library given by
# COOLPROP_LIB_DIR at build time; stub mode without it). Off by default.
coolprop = ["dep:amcrax-coolprop"]

[dependencies]
amcrax-coolprop = { path = "../amcrax-coolprop", version = "0.1.0", optional = true }
amcrax-engine = { workspace = true, features = ["yaml"] }
amcrax-numerics.workspace = true
serde_json.workspace = true

[lints]
workspace = true

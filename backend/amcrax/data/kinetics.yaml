# AmCraX catalyst kinetics registry (kinetics agent, 2026-11-21)
#
# Every parameter: value + exact published unit + citekey + page + locator.
# Values copied from research/model_parameters.yaml and re-checked against the extracted text
# (research/extracted/49_14we431.txt lines 710-747 for Takahashi Table 1;
#  research/extracted/1-s2.0-S0306261925019403-main.txt lines 348-381, 503-532 for Kum Eqs. 2-4 and Table 1).
# Unit conversion to mol NH3 / (kg_cat s) is done in code with the explicit factors below.
# provenance (amcrax.schemas.DataSource): literature

unit_conversions:
  g_per_kg: 1000.0                 # mol/(g s) * 1000 = mol/(kg s)
  bar_per_atm: 1.01325             # exact by definition
  gas_constant_J_per_mol_K: 8.314  # value used by takahashi2016kinetic / kum2026heatintegrated (R in exponent)

catalysts:
  ni_takahashi_microkinetic:
    label: "Ni/MgO microkinetic (Takahashi & Fujitani 2016)"
    metal: Ni
    composition: "30 wt% Ni/MgO, impregnation, calcined 600 degC, 22-42 mesh powder"
    form: takahashi_microkinetic
    usable: true
    rate_law_text: >-
      Elementary steps NH3+s<=>NH3(a) (k1, k-1=k1/K1); NH3(a)+3s->N(a)+3H(a) (k2, irreversible);
      2N(a)->N2+2s (k3, irreversible); 2H(a)<=>H2+2s (k4, k-4=k4/K4).
      r1=k1*(pNH3/ptot)*th_s - k-1*th_NH3; r2=k2*th_NH3*th_s^3; r3=k3*th_N^2; r4=k4*th_H^2 - k-4*(pH2/ptot)*th_s^2;
      th_s=1-th_NH3-th_N-th_H; QSS r1=r2, r2=2r3, 3r2=2r4; r_NH3 = r2 [mol s-1 g-1].
      k_i=A_i exp(-Ea_i/RT), k1=A1 (Ea1=0); K1=A5 exp(-Ea5/RT); K4=A6 exp(-Ea4/RT).
    rate_unit: "mol s^-1 g_cat^-1"
    pressure_basis: "mole fractions p_i/p_total (atm in the source; ratio is unit free)"
    parameters:
      A1:  {value: 75.5,     unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k1)"}
      A2:  {value: 7.54e+15,  unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k2)"}
      Ea2: {value: 144.0,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k2)"}
      A3:  {value: 3.12e+6,   unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k3)"}
      Ea3: {value: 127.8,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k3)"}
      A4:  {value: 3.92e+4,   unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k4)"}
      Ea4: {value: 109.0,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k4; also used for K4, Eq. 25)"}
      A5:  {value: 2.26e-14, unit: "-",             citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K1)"}
      Ea5: {value: -79.4,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K1)"}
      A6:  {value: 4.13e+6,   unit: "-",             citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K4)"}
    reference_values_773K:   # Table 2 (p. 5) - checked in tests with a tolerance (paper rounding, see notes)
      k_minus1: 1.50e+10
      k2: 1.51e+6
      k3: 7.48e-3
      k4: 1.79e-3
      k_minus4: 9.49e-3
      K4: 0.189
      unit: "mol s^-1 g^-1 (K4 dimensionless)"
      citekey: takahashi2016kinetic
      page: 5
      locator: "Table 2; K4 in Sec. 4.2"
    validity: {T_min_K: 623.15, T_max_K: 923.15, P_min_bar: 1.01325, P_max_bar: 1.01325,
               note: "fit 350-450 degC, X<20 %, 1 atm; validated 500-650 degC at 1 atm (Figs. 1, 3, 5)"}
    experimental_basis: "Lab fixed-bed quartz reactor, 1 atm, Ar balance, H2 yield by GC-TCD; catalyst mass not reported; SV 15000-30000 h^-1"
    irreversible_published: true
    limitations:
      - "Steps 2 and 3 irreversible in the source: rate does not vanish at equilibrium (AmCraX approach factor optional, see below)."
      - "Mole-fraction basis: no intrinsic total-pressure dependence; use at 20 bar is an unvalidated extrapolation."
      - "Nomenclature lists T in degC; T in K reproduces Table 2 (used here)."
      - "Table 1 reproduces Table 2 at 500 degC only within 2-7 % (paper rounding); not tuned."
    source: {citekey: takahashi2016kinetic, page: "2-5", locator: "Eqs. 1-14, 20-25; Table 1 (p. 4); Table 2 (p. 5)"}

  ru_takahashi_microkinetic:
    label: "Ru/MgO microkinetic (Takahashi & Fujitani 2016)"
    metal: Ru
    composition: "5 wt% Ru/MgO, impregnation (RuCl3), calcined 600 degC, 22-42 mesh powder"
    form: takahashi_microkinetic
    usable: true
    rate_law_text: "Same elementary-step model as ni_takahashi_microkinetic with Ru parameters (Table 1)."
    rate_unit: "mol s^-1 g_cat^-1"
    pressure_basis: "mole fractions p_i/p_total"
    parameters:
      A1:  {value: 83.6,     unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k1)"}
      A2:  {value: 1.34e+14,  unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k2)"}
      Ea2: {value: 105.8,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k2)"}
      A3:  {value: 6.26e+5,   unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k3)"}
      Ea3: {value: 123.5,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k3)"}
      A4:  {value: 7.18e+2,   unit: "mol s^-1 g^-1", citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k4)"}
      Ea4: {value: 67.8,     unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (k4; also K4)"}
      A5:  {value: 3.49e-13, unit: "-",             citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K1)"}
      Ea5: {value: -64.0,    unit: "kJ mol^-1",     citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K1)"}
      A6:  {value: 1.51e+4,   unit: "-",             citekey: takahashi2016kinetic, page: 4, locator: "Table 1 (K4)"}
    reference_values_773K:
      k_minus1: 1.17e+10
      k2: 9.97e+6
      k3: 3.02e-3
      k4: 1.94e-2
      k_minus4: 4.75e-2
      K4: 0.407
      unit: "mol s^-1 g^-1 (K4 dimensionless)"
      citekey: takahashi2016kinetic
      page: 5
      locator: "Table 2; K4 in Sec. 4.2"
    validity: {T_min_K: 573.15, T_max_K: 823.15, P_min_bar: 1.01325, P_max_bar: 1.01325,
               note: "fit 300-400 degC, X<20 %, 1 atm; validated 450-550 degC at 1 atm (Figs. 2, 4, 5)"}
    experimental_basis: "Lab fixed-bed quartz reactor, 1 atm, Ar balance; catalyst mass not reported; SV 15000-30000 h^-1"
    irreversible_published: true
    limitations:
      - "Steps 2 and 3 irreversible: equilibrium approach factor is an AmCraX extension."
      - "Mole-fraction basis: no total-pressure dependence; 20 bar use is extrapolation."
      - "N2 recombinative desorption is rate limiting on Ru (pp. 6-7)."
    source: {citekey: takahashi2016kinetic, page: "2-5", locator: "Eqs. 1-14, 20-25; Table 1 (p. 4); Table 2 (p. 5)"}

  ru_kum_temkin_pyzhev:
    label: "Ru/Al2O3 Temkin-Pyzhev (Kum et al. 2026, fit to Di Carlo et al. 2014)"
    metal: Ru
    composition: "Ru (8 wt%)/Al2O3 commercial beads (Hypermec 10010)"
    form: temkin_pyzhev
    usable: true
    rate_law_text: "r = ko*exp(-Ea/(R*T)) * [ (P_NH3^2/P_H2^3)^beta - (P_N2/Keq^2)*(P_H2^3/P_NH3^2)^(1-beta) ], P in bar, r in mol g_cat^-1 s^-1 (per mol NH3)"
    rate_unit: "mol g_cat^-1 s^-1"
    pressure_basis: "partial pressures in bar"
    parameters:
      ko:   {value: 55245.9, unit: "mol g_cat^-1 s^-1 bar^0.27", citekey: kum2026heatintegrated, page: 5, locator: "Table 1"}
      Ea:   {value: 114224,  unit: "J mol^-1",                   citekey: kum2026heatintegrated, page: 5, locator: "Table 1"}
      beta: {value: 0.27,    unit: "-",                          citekey: kum2026heatintegrated, page: 5, locator: "Table 1 (beta in Eq. 2)"}
    equilibrium_constant:
      published: "Keq = exp(-dGr/(R*T)); dGr = 95117 - 193.67*T - 0.035293*T^2 + 9.22e-6*T^3 (Eqs. 3-4, p. 4; unit of dGr not printed)"
      dGr_coefficients_J: [95117.0, -193.67, -0.035293, 9.22e-6]
      citekey: kum2026heatintegrated
      page: 4
      locator: "Eqs. 3-4"
      assumption: true
      assumption_text: >-
        dGr is read as J per 2 mol NH3 (2NH3 -> N2 + 3H2), verified against Cantera gri30 to <0.5 kJ (research synthesis check).
        The driving force of Eq. 2 vanishes at equilibrium only if Keq^2 = exp(-dGr/RT) (Keq per mol NH3, 1 bar standard state).
        AmCraX therefore uses Keq^2 = exp(-dGr/(R*T)).
      options: "keq_basis='published' (Eq. 4 with the above reading) or 'amcrax_thermo' (Kp from amcrax.thermodynamics, NASA7/GRI-Mech 3.0)"
    bed_properties:
      eps_b:            {value: 0.36,   unit: "-",     citekey: kum2026heatintegrated, page: 5, locator: "Table 1"}
      rho_cat_kg_m3:    {value: 980.0,  unit: "kg m^-3", citekey: kum2026heatintegrated, page: 5, locator: "Table 1; used as (1-eps_b)*rho_cat in Table 2 mass balance, i.e. particle density"}
      dp_m:             {value: 0.0006, unit: "m",     citekey: kum2026heatintegrated, page: 5, locator: "Table 1"}
      tube_inner_diameter_m: {value: 0.126, unit: "m", citekey: kum2026heatintegrated, page: 5, locator: "Table 1 (Din)"}
    validity: {T_min_K: 623.15, T_max_K: 723.15, P_min_bar: 1.0, P_max_bar: 10.0,
               note: "fit to 36 points of dicarlo2014ammonia, GHSV 300-2400 h^-1, MAPE 0.81 % (p. 9); source applies it up to 773 K / 13 bar"}
    experimental_basis: "Kinetic fit by kum2026heatintegrated to experimental data of dicarlo2014ammonia (commercial Ru/Al2O3)"
    irreversible_published: false
    limitations:
      - "Keq basis ambiguous in the source; AmCraX reading is an assumption (see equilibrium_constant)."
      - "Extrapolation above 723 K and above 10 bar is unvalidated."
      - "Rate is singular at P_H2 -> 0; the PFR starts from a small H2 seed (numerical assumption)."
      - "Nomenclature lists R in m3 bar/(mol K); J/(mol K) is required because Ea is in J/mol."
    source: {citekey: kum2026heatintegrated, page: "4-5, 9", locator: "Eqs. 2-4 (p. 4); Table 1 (p. 5); Sec. 4.1, Fig. 4a (p. 9)"}

# Research expansion (workstream K, 2026-11-23). Kept in a SEPARATE section so that list_catalysts() and the
# /api/kinetics/catalysts endpoint return exactly the three original models (existing behaviour unchanged).
# Access: get_catalyst(id), rate_mol_per_kgcat_s(id, ...), list_research_catalysts().
# Source text: postprint of lucentini2021nirukinetic, UPCommons handle 2117/(item fe1ac9db), read 2026-11-23.
research_catalysts:
  nire_ceo2_5ni1ru_lucentini_lhhw:
    label: "5Ni1Ru/CeO2 LHHW (Lucentini et al. 2021)"
    metal: Ni-Ru
    composition: "Ni 4.98 wt%, Ru 0.64 wt% (ICP-MS) on nanopolycrystalline CeO2, co-impregnation, calcined 450 degC; powder, d_cat 0.10 mm, diluted in SiC"
    form: lhhw_lucentini
    usable: true
    rate_law_text: >-
      r = k*K1*C_NH3 / (1 + K1*C_NH3 + sqrt(C_H2/K4))^2, k = k0*exp(-Ek/(R*T)); C_i in mol m^-3, r in mol NH3 g_cat^-1 s^-1.
      Rate-determining step: first dehydrogenation NH3(a)+s -> NH2(a)+H(a) (Eq. 9); N2 desorption irreversible, H2 adsorption
      quasi-equilibrated (Eqs. 8-13). K1 and K4 are temperature independent as published (Table 3). Irreversible as published.
    rate_unit: "mol NH3 g_cat^-1 s^-1"
    pressure_basis: "molar concentrations C_i = p_i/(R T) in mol m^-3"
    parameters:
      k0: {value: 3.9e+6,  unit: "mol NH3 g_cat^-1 s^-1", uncertainty: 0.7e+6, citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3 (confidence interval, nlpredci)"}
      Ek: {value: 124.0,   unit: "kJ mol^-1",            uncertainty: 8.0,    citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3"}
      K1: {value: 1.1,     unit: "m^3 mol^-1",           uncertainty: 0.2,    citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3 (NH3 adsorption constant)"}
      K4: {value: 4.7e-2,  unit: "mol m^-3",             uncertainty: 0.1e-2, citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3 (H2 desorption constant)"}
    bed_properties:
      rho_apparent_kg_m3: {value: 1651.8, unit: "kg m^-3", citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4 (MIP apparent density)"}
      eps_L_diluted_bed:  {value: 0.2451, unit: "-",       citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4, Eq. 5 (catalyst + SiC bed)"}
      eps_av_catalyst_only: {value: 0.3855, unit: "-",     citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4, Eq. 6 (bed of catalyst particles only, d_i 4.572 mm)"}
      d_cat_m:            {value: 0.00010, unit: "m",      citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4"}
      reactor_inner_diameter_m: {value: 0.004572, unit: "m", citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4, Eq. 6"}
    validity: {T_min_K: 623.15, T_max_K: 873.15, P_min_bar: 1.01325, P_max_bar: 1.01325,
               note: "fitted 350-550/600 degC, 1 atm, NH3 10-100 % in Ar (F/W 15-45 L g^-1 h^-1, H2 co-feed 0-67.5 %); every use above 1 atm is extrapolation"}
    experimental_basis: "0.1 g powder in SiC (bed 0.41 cm3), stainless-steel tube d_i 4.572 mm, 1 atm, isothermal PFR fit (Eqs. 2-4), MS analysis (+/-5 %)"
    irreversible_published: true
    limitations:
      - "Irreversible as published: the AmCraX equilibrium approach factor (1 - Q/Kp) is applied by default (switchable)."
      - "Fitted at 1 atm only; K1 and K4 are temperature independent; total-pressure dependence enters only through concentrations (extrapolation above 1 atm unvalidated)."
      - "Blank (empty reactor / SiC / CeO2) conversion was 4, 9 and 24 % at 400, 450, 500 degC (p. 10); the paper does not state that blank activity was subtracted."
      - "Gas-volume reference conditions of the mL min^-1 flows are not stated (AmCraX assumes 0 degC, 1 atm; 25 degC tested as sensitivity)."
      - "Powder (0.1 mm) intrinsic kinetics: industrial pellets need an effectiveness factor (not modelled)."
    source: {citekey: lucentini2021nirukinetic, page: "8-9, 21-25", locator: "Eqs. 2-6, 8-13, 17-18; Table 1 (p. 10); Table 2 (p. 23); Table 3 (p. 24)"}

  nire_ceo2_2p5ni0p5ru_lucentini_lhhw:
    label: "2.5Ni0.5Ru/CeO2 LHHW (Lucentini et al. 2021)"
    metal: Ni-Ru
    composition: "Ni 2.39 wt%, Ru 0.35 wt% (ICP-MS) on nanopolycrystalline CeO2, co-impregnation, calcined 450 degC; powder, d_cat 0.10 mm, diluted in SiC"
    form: lhhw_lucentini
    usable: true
    rate_law_text: "Same LHHW expression as nire_ceo2_5ni1ru_lucentini_lhhw (Eq. 17) with the 2.5Ni0.5Ru/CeO2 parameters of Table 3."
    rate_unit: "mol NH3 g_cat^-1 s^-1"
    pressure_basis: "molar concentrations C_i = p_i/(R T) in mol m^-3"
    parameters:
      k0: {value: 3.3e+5,  unit: "mol NH3 g_cat^-1 s^-1", uncertainty: 0.8e+5, citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3"}
      Ek: {value: 107.0,   unit: "kJ mol^-1",            uncertainty: 11.0,   citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3"}
      K1: {value: 1.2,     unit: "m^3 mol^-1",           uncertainty: 0.3,    citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3"}
      K4: {value: 4.5e-2,  unit: "mol m^-3",             uncertainty: 0.2e-2, citekey: lucentini2021nirukinetic, page: 24, locator: "Table 3"}
    bed_properties:
      rho_apparent_kg_m3: {value: 1651.8, unit: "kg m^-3", citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4 (single value reported for the kinetic analysis)"}
      eps_L_diluted_bed:  {value: 0.2451, unit: "-",       citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4, Eq. 5"}
      eps_av_catalyst_only: {value: 0.3855, unit: "-",     citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4, Eq. 6"}
      d_cat_m:            {value: 0.00010, unit: "m",      citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4"}
      reactor_inner_diameter_m: {value: 0.004572, unit: "m", citekey: lucentini2021nirukinetic, page: 8, locator: "Sec. 2.4"}
    validity: {T_min_K: 623.15, T_max_K: 873.15, P_min_bar: 1.01325, P_max_bar: 1.01325,
               note: "fitted 350-550/600 degC, 1 atm; the source itself simulates pure NH3 at 1 atm (Fig. 10); above 1 atm is extrapolation"}
    experimental_basis: "As nire_ceo2_5ni1ru_lucentini_lhhw"
    irreversible_published: true
    limitations:
      - "Irreversible as published: AmCraX equilibrium approach factor applied by default (switchable)."
      - "Fitted at 1 atm only; K1, K4 temperature independent; extrapolation above 1 atm unvalidated."
      - "Initial deactivation of about 2 % over 100 h at 450 degC (p. 12) is not modelled."
      - "Blank conversion 4/9/24 % at 400/450/500 degC (p. 10), subtraction not stated."
      - "Powder intrinsic kinetics; no effectiveness factor."
    source: {citekey: lucentini2021nirukinetic, page: "8-9, 21-25", locator: "Eq. 17-18; Table 1 (p. 10); Table 3 (p. 24)"}

# AmCraX extension (not in any source): equilibrium approach factor for irreversible published laws.
equilibrium_approach_factor:
  applies_to_forms: [takahashi_microkinetic, lhhw_lucentini]
  expression: "r_AmCraX = r_published * (1 - Q/Kp),  Q = y_N2^0.5 * y_H2^1.5 * (P/1 bar) / y_NH3,  Kp from amcrax.thermodynamics"
  default_on: true
  label: "assumption (AmCraX extension)"
  rationale: >-
    The published microkinetic model omits the reverse of steps 2 and 3 (valid at 1 atm, far from equilibrium at
    the authors' conditions). At 20 bar the cracked gas approaches equilibrium, and an irreversible law would predict
    conversion above equilibrium. The factor forces r -> 0 at equilibrium; it is switchable (approach_factor=False).


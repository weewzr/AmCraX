[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amcrax"
version = "0.1.0"
description = "AmCraX - Ammonia Cracking Simulation and Optimisation Platform (Aspen Plus V15 + Python)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "cantera",
    "pydantic>=2",
    "pyyaml",
    "fastapi",
    "uvicorn[standard]",
    "pywin32; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
where = ["."]
include = ["amcrax*"]

[tool.setuptools.package-data]
amcrax = ["data/*.json", "data/*.yaml"]

# AmCraX curated parameter registry (research synthesis, 2026-11-21)
#
# Every value is copied from research/notes/<citekey>.json (which were checked against the PDFs by the
# extraction agents) and carries citekey + page + locator. Values computed by AmCraX agents (not paper data)
# are marked `kind: amcrax_check`. Assumptions are marked `assumption: true` with a rationale.
# Provenance label to use in code (amcrax.schemas.DataSource): literature (unless stated otherwise).
# Literature results are benchmarks/comparators only, never AmCraX results.
# Units follow docs/developer_guide.md where possible; where the paper unit differs, the paper unit is kept
# and stated explicitly (do not silently convert).

meta:
  version: 1
  generated_by: research synthesis agent
  references: research/references.json
  traceability: research/traceability.json
  gas_constant_J_per_mol_K: 8.314   # value used by takahashi2016kinetic / maccarrone2025comprehensive Eq. 13 / su2023review Eq. 3

# ---------------------------------------------------------------------------------------------------------
kinetics:
  # ---------------- USABLE ----------------
  ni_takahashi_microkinetic:
    usable: true
    usable_conditions: >-
      Fitted at 1 atm, <20 % conversion, 350-450 degC; validated to high conversion at 500-650 degC, 1 atm.
      Rate uses mole fractions only (p_i/p_total), so it has no intrinsic total-pressure dependence; use at
      20 bar is an unvalidated extrapolation that must be labelled. Steps 2 and 3 are irreversible, so the model
      can exceed equilibrium: the reactor model must cap conversion at equilibrium (labelled assumption).
    catalyst: 30 wt% Ni/MgO, 22-42 mesh powder
    source: {citekey: takahashi2016kinetic, page: 2-4, locator: "Eqs. 5-14, 20-25; Table 1 (p. 4)"}
    mechanism:
      - "NH3(g) + s <=> NH3(a)         (k1, k_-1 = k1/K1)"
      - "NH3(a) + 3s -> N(a) + 3H(a)   (k2, irreversible, lumped dehydrogenation)"
      - "2N(a) -> N2(g) + 2s           (k3, irreversible)"
      - "2H(a) <=> H2(g) + 2s          (k4, k_-4 = k4/K4)"
    rate_expressions:
      r1: "k1*(p_NH3/p_total)*theta_s - (k1/K1)*theta_NH3"
      r2: "k2*theta_NH3*theta_s**3"
      r3: "k3*theta_N**2"
      r4: "k4*theta_H**2 - (k4/K4)*(p_H2/p_total)*theta_s**2"
      site_balance: "theta_s = 1 - theta_NH3 - theta_N - theta_H"
      quasi_steady_state: "r1 = r2;  r2 = 2*r3;  3*r2 = 2*r4   (Eqs. 12-14)"
      nh3_consumption_rate: "r_NH3 = r2 = r1  [mol NH3 s^-1 g_cat^-1]"
      temperature_dependence: "k_i = A_i*exp(-Ea_i/(R*T)), T in K (nomenclature says degC; K reproduces Table 2)"
      K4_note: "K4 = A6*exp(-Ea4/(R*T)) uses the same Ea as k4, so k_-4 = A4/A6 is T-independent"
    pfr_equations: "dF/dm = -r1 + r3 + r4; dy_i/dm = (nu_i_rate - y_i*(-r1 + r3 + r4))/F, m = catalyst mass [g], F [mol/s] (Eqs. 15-19, pp. 2-3)"
    rate_basis: per gram catalyst
    rate_unit: mol s^-1 g_cat^-1
    pressure_unit: atm (used only as p_i/p_total)
    parameters:
      A1: {value: 75.5,     unit: mol s^-1 g^-1}
      Ea1: {value: 0.0,     unit: kJ/mol, note: non-activated adsorption}
      A2: {value: 7.54e15,  unit: mol s^-1 g^-1}
      Ea2: {value: 144.0,   unit: kJ/mol}
      A3: {value: 3.12e6,   unit: mol s^-1 g^-1}
      Ea3: {value: 127.8,   unit: kJ/mol}
      A4: {value: 3.92e4,   unit: mol s^-1 g^-1}
      Ea4: {value: 109.0,   unit: kJ/mol}
      A5_K1: {value: 2.26e-14, unit: "-"}
      Ea5_K1: {value: -79.4, unit: kJ/mol, note: "negative = exothermic adsorption; K1 = A5*exp(+79400/(R*T))"}
      A6_K4: {value: 4.13e6, unit: "-", note: uses Ea4}
    reference_values_500C:   # Table 2, p. 5 - use for unit tests with ~10 % tolerance (see check below)
      k_minus1: 1.50e10
      k2: 1.51e6
      k3: 7.48e-3
      k4: 1.79e-3
      k_minus4: 9.49e-3
      K4: 0.189
      unit: "mol s^-1 g^-1 (K4 dimensionless)"
      locator: "Table 2 (p. 5); K4 in text Sec. 4.2"
    amcrax_check: "Table 1 evaluated at 773.15 K gives values 2-7 % below Table 2 (k_-4 exact); likely rounding. Do not tune (extraction agent check, takahashi2016kinetic notes)."
    validation_data: "Fig. 3a-c, Fig. 5a (p. 5), Fig. 1a (p. 3): see traceability.json kinetics.ni_takahashi_microkinetic"
    known_gaps:
      - Catalyst mass, bed density and SV basis not reported; conversion-vs-SV figures need a labelled W/F assumption.
      - Figure readings approximate (+/-2 percentage points); 'H2 yield' treated as NH3 conversion.

  ru_takahashi_microkinetic:
    usable: true
    usable_conditions: >-
      Fitted at 1 atm, <20 % conversion, 300-400 degC; validated at 450-550 degC, 1 atm. Same caveats as the Ni
      model (mole-fraction basis, no pressure dependence, no reverse of steps 2/3, equilibrium cap required).
    catalyst: 5 wt% Ru/MgO, 22-42 mesh powder
    source: {citekey: takahashi2016kinetic, page: 2-4, locator: "Eqs. 5-14, 20-25; Table 1 (p. 4)"}
    rate_expressions: same_as ni_takahashi_microkinetic
    rate_basis: per gram catalyst
    rate_unit: mol s^-1 g_cat^-1
    pressure_unit: atm (used only as p_i/p_total)
    parameters:
      A1: {value: 83.6,     unit: mol s^-1 g^-1}
      Ea1: {value: 0.0,     unit: kJ/mol}
      A2: {value: 1.34e14,  unit: mol s^-1 g^-1}
      Ea2: {value: 105.8,   unit: kJ/mol}
      A3: {value: 6.26e5,   unit: mol s^-1 g^-1}
      Ea3: {value: 123.5,   unit: kJ/mol}
      A4: {value: 7.18e2,   unit: mol s^-1 g^-1}
      Ea4: {value: 67.8,    unit: kJ/mol}
      A5_K1: {value: 3.49e-13, unit: "-"}
      Ea5_K1: {value: -64.0, unit: kJ/mol}
      A6_K4: {value: 1.51e4, unit: "-", note: uses Ea4}
    reference_values_500C:
      k_minus1: 1.17e10
      k2: 9.97e6
      k3: 3.02e-3
      k4: 1.94e-2
      k_minus4: 4.75e-2
      K4: 0.407
      unit: "mol s^-1 g^-1 (K4 dimensionless)"
      locator: "Table 2 (p. 5); K4 in text Sec. 4.2"
    rate_determining_step: "N2 recombinative desorption limits Ru; NH3 dehydrogenation controls Ni (pp. 6-7)"
    validation_data: "Fig. 4a-c, Fig. 5b (p. 5), Fig. 2a (p. 3)"

  ru_kum_temkin_pyzhev:
    usable: true
    usable_conditions: >-
      Fitted to Di Carlo et al. (2014) data, 623-723 K (350-450 degC), 1-10 bar, GHSV 300-2400 h^-1 (MAPE 0.81 %,
      36 points). Use above 723 K or above 10 bar is extrapolation (the source paper itself applies it to 773 K and
      13 bar). Pressure dependent and reversible, so it is the preferred rate law for the 20 bar baseline,
      with a labelled extrapolation flag.
    catalyst: Ru (8 wt%)/Al2O3 commercial beads (Hypermec 10010)
    source: {citekey: kum2026heatintegrated, page: 4-5, locator: "Eq. 2-4 (p. 4); Table 1 (p. 5); Fig. 4a (p. 9)"}
    experimental_data_source: dicarlo2014ammonia
    rate_expression: "r = ko*exp(-Ea/(R*T)) * [ (P_NH3**2/P_H2**3)**beta - (P_N2/Keq**2)*(P_H2**3/P_NH3**2)**(1-beta) ]"
    rate_basis: per gram catalyst
    rate_unit: mol g_cat^-1 s^-1
    pressure_unit: bar (partial pressures)
    parameters:
      ko: {value: 55245.9, unit: "mol g_cat^-1 s^-1 bar^0.27", locator: "Table 1 p. 5 (confirmed in extracted text)"}
      Ea: {value: 114224, unit: J/mol}
      beta: {value: 0.27, unit: "-"}
    equilibrium_constant:
      as_printed: "Keq = exp(-dGr/(R*T)); dGr = 95117 - 193.67*T - 0.035293*T**2 + 9.22e-6*T**3  (T in K; unit of dGr not printed)"
      locator: "Eqs. 3-4, p. 4"
      basis_issue: >-
        AmCraX check (Cantera 3.2.0 gri30 thermo, synthesis agent): Eq. 4 matches dG for 2NH3 -> N2 + 3H2 in J
        (-37.04 vs -36.94 kJ at 623 K; -71.45 vs -71.12 kJ at 773 K; -94.76 vs -94.23 kJ at 873 K). The driving force
        in Eq. 2 is zero at equilibrium only if Keq**2 = P_N2*P_H2**3/P_NH3**2, i.e. Keq is per mol NH3.
      assumption: true
      assumption_text: "Use Keq**2 = exp(-dGr/(R*T)) with dGr from Eq. 4 (per 2 mol NH3), standard state 1 bar."
      rationale: Only reading consistent with both the stoichiometry of the driving force and the thermodynamics check.
    known_gaps:
      - "Nomenclature lists R in m3 bar/mol/K; J/(mol K) is required in the exponent (Ea in J/mol)."
      - Rate singular at P_H2 -> 0 (reactor inlet); integrator needs a small H2 seed or analytic start (labelled numerical assumption).
    bed_properties: {eps_b: 0.36, rho_cat_kg_m3: 980, dp_m: 0.0006, locator: "Table 1 p. 5 (from Chiuta 2016 / Di Carlo 2014)"}

  # ---------------- NOT USABLE (kept for completeness / sanity ranges only) ----------------
  ru_k_cao_sayas_power_law:
    usable: false
    reason: "Orders and E_app are usable as sanity checks, but K0 = 8584.8 printed as mol gcat^-1 s^-1 with no pressure unit; original paper not in local library."
    catalyst: Ru (3 wt%)-10%K/CaO
    rate_expression: "-r_NH3 = k*p_NH3**alpha*p_H2**gamma*[1 - (1/K_eq)*(p_H2**3*p_N2/p_NH3**2)]  (K_eq per 2 mol NH3 inferred, not stated)"
    parameters: {E_app_kJ_mol: 111, alpha: 0.5, gamma: -1.2, K0_as_printed: 8584.8}
    source: {citekey: maccarrone2025comprehensive, page: 19-20, locator: "Table 4 (p. 19); Table 5 (p. 20)"}
    original_source: sayas2020high
    primary_source_check_2026_11_24: >-
      Main text of Sayas et al. 2020 (sayas2020rukcao, same paper as sayas2020high) read in full on 24 November 2026
      (research/notes/sayas2020_full_text.md). E_app 111 kJ/mol and K0 8584.8: NOT in the main text; the main text
      (Table 4, p. 5033) gives an apparent activation energy of 75 kJ/mol (orders 0.5 and -1.2) for 3%Ru10%K/CaO at
      350 degC and 1 atm from differential experiments; the rate constant, its units and the equilibrium term of the
      integral fit are in the supplementary information, which was NOT obtained. So 111 kJ/mol and 8584.8 remain
      unverified secondary values (maccarrone2025comprehensive); the orders 0.5 and -1.2 are confirmed. Nothing is fitted
      or implemented; usable stays false.
    k_ru_ratio_note: >-
      The abstract states a K/Ru atomic ratio of 0.9, which is inconsistent with the stated loadings: 10 wt% K and
      3 wt% Ru give (10/39.10)/(3/101.07) = 8.6 mol/mol (reader arithmetic; ICP 9.6 and 2.8 wt% give 8.9). Any project
      statement of "K/Ru = 0.9" carries this inconsistency of the paper.
  ni_ba_al_o_im_power_law:
    usable: false
    reason: "Power-law orders and E_app only; no pre-exponential factor."
    catalyst: 20 wt% Ni/Ba-Al-O
    rate_expression: "r = k*p_NH3**alpha*p_H2**gamma"
    parameters: {E_app_kJ_mol: 76.5, alpha: 0.47, gamma: -0.32, T_C: 450, rds: H2 desorption}
    other_supports: {Sr: {E_app: 81.1, alpha: 0.58, gamma: -0.38}, Ca: {E_app: 87.2, alpha: 0.70, gamma: -0.42}, Mg: {E_app: 89.3, alpha: 0.39, gamma: -0.62}}
    source: {citekey: maccarrone2025comprehensive, page: 20, locator: Table 5}
    original_source: im2020ammonia
  ru_al2o3_dicarlo_temkin_review_entry:
    usable: false
    reason: "Review reprints K0 = 1.5e-9 'mol m-3 s-1' (implausible, no pressure unit). Use ru_kum_temkin_pyzhev (fit to the same data) instead."
    parameters: {E_app_kJ_mol: 117, beta: 0.27}
    source: {citekey: maccarrone2025comprehensive, page: 20, locator: Table 5}
    original_source: dicarlo2014ammonia
  chopra_temkin_pyzhev:
    usable: false
    reason: "beta not reported; Table 1 malformed in publisher PDF; catalyst printed as Li2NH; units of r and P not stated."
    parameters: {k0_s_inv: 2.92e6, E0_kJ_mol: 141.5}
    source: {citekey: chopra2026decentralized, page: 3-4, locator: "Eq. 2; Table 1"}
  mehr_temkin_pyzhev_ni:
    usable: false
    reason: "No pre-exponential factor; alpha/beta confusion (0.209 vs 0.5 vs 0.21); cited sources unreliable."
    parameters: {Ea_kJ_mol: 95.6, beta_probable: 0.209}
    source: {citekey: mehr2026highcapacity, page: 5-7, locator: "Eq. 4; Sec. 2.7"}
  tamaru_langmuir:
    usable: false
    reason: "Energy units of 49600/39600 not stated (likely cal/mol, unverified); rate per surface area (molecules cm^-2 s^-1); metal not stated in the reviews."
    rate_expression: "r = k_R*K*P_NH3/(1 + K*P_NH3); k_R = 1.57e28*exp(-49600/(R*T)); K = 6.7e-9*exp(39600/(R*T)) [Torr^-1]"
    source: {citekey: su2023review, page: 16, locator: Eq. 4}
    also_in: {citekey: xu2025review, page: 8, locator: Fig. 6}
    original_source: tamaru1988new
  itoh_langmuir_hinshelwood:
    usable: false
    reason: "No numerical kf, kn, kp in the local library; kf unit printed as mmol s/(kg_cat MPa)."
    rate_expression: "r = kf*(p_NH3**2 - p_H2**3*p_N2/kp)/(p_H2**1.5 + sqrt(kn*p_NH3**2))**2, p in MPa"
    source: {citekey: maccarrone2025comprehensive, page: 19, locator: Table 4}
    original_source: itoh2014kinetic
  mccabe_ni_zero_first_order:
    usable: false
    reason: Functional form only, no parameter values in local library.
    source: {citekey: xu2025review, page: 8, locator: Fig. 6}
    original_source: mccabe1983kinetics
  supplementary_only:
    usable: false
    entries:
      - {citekey: cho2026nickel, what: "Ni/Al2O3 (Collins 1993) and Ru-K/CaO kinetics", locator: "Supplementary S1 (not in repository)"}
      - {citekey: richard2024technoeconomic, what: "Temkin-Pyzhev-like k0, E0, beta (Eq. 4)", locator: "Supplementary S4 (not in repository)"}
      - {citekey: ahmad2025gtcc, what: "Temkin-Pyzhev k0, E0, beta (Eq. 2)", locator: "not reported"}

  sanity_ranges:
    ru_apparent_activation_energy_kJ_mol: {range: [41.55, 98.2], citekey: su2023review, page: 6, locator: Table 2}
    ru_tof_s_inv: {range: [0.04, 11.4], citekey: su2023review, page: 6, locator: Table 2}
    ni_ru_ceo2_activation_energy_kJ_mol: {range: [107, 124], citekey: su2023review, page: 19, locator: text Sec. 3.2}
    n2_desorption_ea_ni_pt_kJ_mol: {range: [125, 210], citekey: takahashi2016kinetic, page: 4, locator: text Sec. 3}

  stability:
    ni_industrial_reference:
      conditions: "534 degC, 1 atm, 490 mL/min NH3 + 10 mL/min Ar, 500 mg catalyst + 4.5 g SiC, 60,000 mL g^-1 h^-1"
      X_after_reduction_pct: 80
      X_max_pct_at_250h: 91.9
      X_at_800h_pct: 90.4
      source: {citekey: purcel2024stability, page: 2, locator: "text; Fig. 3"}
      derived_rate_pct_points_per_h: {value: -0.0027, kind: amcrax_check, note: "(90.4-91.9)/(800-250), derived by extraction agent"}
    ni_al2o3_coprecipitated:
      X_max_pct: 54.1
      deactivation_over_800h_pct: {value: 13.5, note: relative vs absolute basis ambiguous}
      d_Ni_nm: {fresh: 3.5, after_1000h: 5.0}
      S_BET_m2_g: {reduced: 169, after_1000h: 150}
      source: {citekey: purcel2024stability, page: 2-4, locator: "text; Table 1"}
    ru_mgo_endurance:
      statement: ">1000 h at 873-973 K, linear deactivation X = -k*t + X0, k Arrhenius"
      source: {citekey: su2023review, page: 6, locator: "Fig. 3a"}
      original_source: yamazaki2022evaluation

